name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

  docker-build-push:
    name: Docker Build & Push
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name (GHCR requires lowercase)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-task-tracker" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy (Docker Compose)
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: cp .env.example .env

      - name: Start application with Docker Compose
        run: docker compose up -d --build

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000/health; then echo " <- app is healthy"; exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down -v
        
  deploy-ec2:
    name: Deploy to AWS EC2 (SSM)
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::706016980137:role/GitHub-SSM-Deploy-Role
          aws-region: ap-south-1

      - name: Deploy through AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-05b007e51ad0c83b9" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["cd /home/ubuntu/devops-task-tracker && git pull origin main && docker compose up -d --build"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-05b007e51ad0c83b9" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-05b007e51ad0c83b9"
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out"
          exit 1

  
